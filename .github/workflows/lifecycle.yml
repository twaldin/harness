name: subprocess lifecycle

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: bun install --frozen-lockfile
        working-directory: ts
      # Dependency installation above may use the network. All tests below use
      # deterministic local children, no provider CLI or credentials.
      - name: Python offline conformance
        run: PYTHONPATH=src uv run --offline pytest tests/
      - name: TypeScript offline conformance (Bun)
        run: bun test
        working-directory: ts
      - name: Type-check source and conformance tests
        run: bun x tsc --noEmit --rootDir . --allowJs
        working-directory: ts
      - run: bun run build
        working-directory: ts
      - name: Built-package subprocess smoke (Node)
        run: node tests/node-lifecycle.mjs
        working-directory: ts
      - name: Built-package RPC session conformance (Node)
        run: node tests/node-sessions.mjs
        working-directory: ts
      - name: Built-package OMP SDK bridge conformance (Node)
        run: node tests/node-omp-sdk.mjs
        working-directory: ts
      - name: Built-package Amp SDK bridge conformance (Node)
        run: node tests/node-amp-sdk.mjs
        working-directory: ts
      - name: Built-package caller-owned OpenCode conformance (Node)
        run: node tests/node-opencode.mjs
        working-directory: ts
      - name: Built-package Factory Droid SDK conformance (Node)
        run: node tests/node-droid-sdk.mjs
        working-directory: ts
      - name: Built-package Claude SDK conformance (Node)
        run: node tests/node-claude-sdk.mjs
        working-directory: ts
      - name: Built-package Cline SDK conformance (Node)
        run: node tests/node-cline-sdk.mjs
        working-directory: ts
      - name: Built-package caller-owned OpenHands conformance (Node)
        run: node tests/node-openhands.mjs
        working-directory: ts

  installed-python-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v6
      - name: Check types from an isolated wheel consumer
        run: |
          uv build --wheel
          consumer="$(mktemp -d)"
          uv venv "$consumer/.venv"
          uv pip install --python "$consumer/.venv/bin/python" dist/*.whl mypy==2.3.1
          cp tests/typing/consumer.py "$consumer/consumer.py"
          cd "$consumer"
          .venv/bin/python -I -c 'import harness, pathlib, sys; from importlib.metadata import version; assert pathlib.Path(harness.__file__).is_relative_to(pathlib.Path(sys.prefix)); assert harness.__version__ == version("harness-cli"); print(harness.__file__, harness.__version__)'
          .venv/bin/mypy --strict consumer.py
